<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>WEB電卓</title>
    <link rel="stylesheet" href="static/reset.css">
    <link rel="stylesheet" href="static/style.css">
    
    <link rel="icon" href="static/favicon.ico" type="x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1 id="header">WEB電卓</h1>
    </header>
    <main>
        <div class="flex">
            <div class="history-container">
                <h2>履歴</h2>
                <div id="history">
                    
                </div>
            </div>

            <div class="calculator">
                <input type="text" id="display" value="0" readonly>
                <div class="buttons">
                    <button class="top-button-b" onclick="clearDisplay()" title="すべて削除">AC</button>
                    <button class="top-button-b" onclick="backspace('')" title="一文字削除">←</button>
                    <button class="top-button-s" onclick="addDisplay('start')">(</button>
                    <button class="top-button-s" onclick="addDisplay('end')">)</button>
                    <button class="top-button-s" onclick="('')" title="符号を反転">+/-</button>
                    <button class="top-button-s" onclick="('')" title="パーセントに変換">%</button>
                    <button class="button" onclick="addDisplay('7')">7</button>
                    <button class="button" onclick="addDisplay('8')">8</button>
                    <button class="button" onclick="addDisplay('9')">9</button>
                    <button class="button" onclick="addOperator('/')">÷</button>
                    <button class="button" onclick="addDisplay('4')">4</button>
                    <button class="button" onclick="addDisplay('5')">5</button>
                    <button class="button" onclick="addDisplay('6')">6</button>
                    <button class="button" onclick="addOperator('*')">×</button>
                    <button class="button" onclick="addDisplay('1')">1</button>
                    <button class="button" onclick="addDisplay('2')">2</button>
                    <button class="button" onclick="addDisplay('3')">3</button>
                    <button class="button" onclick="addOperator('-')">-</button>
                    <button class="button" onclick="addDisplay('0')">0</button>
                    <button class="button" onclick="addDisplay('.')">.</button>
                    <button class="button" onclick="calculate()">=</button>
                    <button class="button" onclick="addOperator('+')">+</button>
                </div>
            </div>

        </div>
    </main>
<script src="static/script.js"></script>
</body>
</html>
